[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradeguard"
version = "0.1.0"
description = "Local-first stock research, screening and trading discipline tools for agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2", "numpy>=2,<3", "pandas>=2.2,<4",
  "pymysql>=1.1,<2", "cryptography>=45,<46", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3", "pydantic-settings>=2.9,<3",
  "sqlalchemy>=2.0.40,<3", "typer>=0.16,<1",
]

[project.optional-dependencies]
market = ["baostock>=0.8.9,<1"]
migration = ["psycopg[binary]>=3.2,<4"]
futu = ["futu-api>=9,<10"]
longbridge = ["longbridge>=4.3,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.16,<2", "pandas-stubs>=2.2", "httpx>=0.28,<1"]

[project.scripts]
tradeguard = "tradeguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeguard"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["src/tradeguard/screening/strategies/", "src/tradeguard/screening/indicators.py"]

[[tool.mypy.overrides]]
module = ["tradeguard.screening.strategies.*", "tradeguard.screening.indicators"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
