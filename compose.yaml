name: tradeguard
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: tradeguard_dev_root
      MYSQL_DATABASE: tradeguard
      MYSQL_USER: tradeguard
      MYSQL_PASSWORD: tradeguard
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  mysql_data:
